name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - name: Check for schema changes since the last successful deployment
        id: schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/d1-migrations-needed.mjs

      # Every migration is CREATE ... IF NOT EXISTS, so re-running one that the
      # remote d1_migrations table does not list is harmless.
      - name: Apply D1 migrations
        if: steps.schema.outputs.needed == 'true'
        run: npx wrangler d1 migrations apply family-mission-control --remote

      - run: npm run build:cloudflare

      - run: npm run deploy:cloudflare
